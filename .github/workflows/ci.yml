
name: Node.js CI and Docker Publishing

on:
  push:
    branches: [main, lab6-ci-pipeline, lab7-ghcr-deployment]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: Lab6-CI/package-lock.json

      - name: Install dependencies
        working-directory: Lab6-CI
        run: npm ci

      - name: Lint application
        working-directory: Lab6-CI
        run: npm run lint

      - name: Run tests
        working-directory: Lab6-CI
        run: npm test

      - name: Package application
        working-directory: Lab6-CI
        run: npm run build

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: node-package-${{ matrix.node-version }}
          path: Lab6-CI/*.tgz

  publish-docker:
    permissions:
      contents: read
      packages: write

    needs: build-and-test
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image owner
        id: image
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./ShopEasy-Lite
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/shopeasy-lite:${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.owner }}/shopeasy-lite:latest
